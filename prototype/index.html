<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub for bb — v3</title>
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<style>
/* bb theme fallbacks: values read from the running app (research/bb-live/tokens-*.json) */
:root{
  --fb-bg: oklch(100% 0 0); --fb-fg: oklch(32.11% 0 0); --fb-mfg: oklch(44% 0 0); --fb-sfg: oklch(50% 0 0);
  --fb-border: color-mix(in oklch, oklch(32.11% 0 0) 14%, oklch(100% 0 0)); --fb-seam: #e9eaea; --fb-input: color-mix(in oklch, oklch(32.11% 0 0) 29.5%, oklch(100% 0 0)); --fb-muted: #e6e6e6;
  --fb-hover: color-mix(in oklab, oklch(32.11% 0 0) 5.9%, transparent); --fb-active: color-mix(in oklab, oklch(32.11% 0 0) 11.8%, transparent);
  --fb-raised: color-mix(in oklab, oklch(32.11% 0 0) 2.5%, transparent); --fb-recessed: color-mix(in oklab, oklch(32.11% 0 0) 6%, transparent);
  --fb-sidebar: color-mix(in oklch, oklch(32.11% 0 0) 2.2%, oklch(100% 0 0)); --fb-sidebar-accent: color-mix(in oklch, oklch(32.11% 0 0) 8%, oklch(100% 0 0));
  --fb-red: oklch(45% .19 25.8625); --fb-success: oklch(70% .15 155); --fb-attention: oklch(74% .15 80); --fb-warning: oklch(55% .14 50);
  --fb-merged: oklch(53% .2 295); --fb-add: #005c32; --fb-rem: #8d0000; --fb-sel: color-mix(in oklab, oklch(27% 0 0) 16%, transparent);
  --fb-sh-xs: 0px 2px 0px 0px #33333312; --fb-sh-sm: 0px 2px 0px 0px #33333314, 0px 1px 3px 0px #3333331a; --fb-sh-md: 0px 2px 0px 0px #33333326, 0px 2px 4px -1px #33333326; --fb-sh-lg: 0px 2px 0px 0px #33333326, 0px 4px 6px -1px #33333326; --fb-lift: 0 -4px 12px -4px #33333312;
}
@media (prefers-color-scheme: dark){
  :root{
    --fb-bg: oklch(19.5% 0 0); --fb-fg: oklch(81% 0 0); --fb-mfg: oklch(78% 0 0); --fb-sfg: oklch(68% 0 0);
    --fb-border: color-mix(in oklch, oklch(81% 0 0) 19.4%, oklch(19.5% 0 0)); --fb-seam: #252525; --fb-input: color-mix(in oklch, oklch(81% 0 0) 32.6%, oklch(19.5% 0 0)); --fb-muted: #2c2c2c;
    --fb-hover: color-mix(in oklab, oklch(81% 0 0) 13.8%, transparent); --fb-active: color-mix(in oklab, oklch(81% 0 0) 22.5%, transparent);
    --fb-raised: color-mix(in oklab, oklch(81% 0 0) 2.5%, transparent); --fb-recessed: color-mix(in oklab, oklch(81% 0 0) 6%, transparent);
    --fb-sidebar: color-mix(in oklch, oklch(81% 0 0) 4.3%, oklch(19.5% 0 0)); --fb-sidebar-accent: color-mix(in oklch, oklch(81% 0 0) 12%, oklch(19.5% 0 0));
    --fb-red: oklch(65% .16 22); --fb-success: oklch(74% .15 155); --fb-attention: oklch(80% .15 80); --fb-warning: oklch(75% .16 50);
    --fb-merged: oklch(68% .18 295); --fb-add: #00d594; --fb-rem: #ff696d; --fb-sel: color-mix(in oklab, oklch(82% 0 0) 12%, transparent);
    --fb-sh-xs: 0px 2px 0px 0px #0003; --fb-sh-sm: 0px 2px 0px 0px #0000004d, 0px 1px 3px 0px #00000066; --fb-sh-md: 0px 2px 0px 0px #0000004d, 0px 2px 4px -1px #00000080; --fb-sh-lg: 0px 2px 0px 0px #0000004d, 0px 4px 6px -1px #00000080; --fb-lift: 0 -4px 12px -4px #00000042;
  }
}
/* the system: 3 inks, one hue per row, 5 sizes, 4px grid */
:root{
  --bg: var(--background, var(--fb-bg));
  --t1: var(--foreground, var(--fb-fg));
  --mfg: var(--muted-foreground, var(--fb-mfg));
  --t2: var(--subtle-foreground, var(--fb-sfg));
  --t3: color-mix(in oklab, var(--t2) 60%, transparent);
  --line: var(--border, var(--fb-border));
  --seam: var(--border-seam, var(--fb-seam));
  --inp: var(--input, var(--fb-input));
  --muted-bg: var(--muted, var(--fb-muted));
  --hover: var(--state-hover, var(--fb-hover));
  --active: var(--state-active, var(--fb-active));
  --raised: var(--surface-raised, var(--fb-raised));
  --recessed: var(--surface-recessed, var(--fb-recessed));
  --band: var(--side);
  --side: var(--sidebar, var(--fb-sidebar));
  --side-acc: var(--sidebar-accent, var(--fb-sidebar-accent));
  --red: var(--destructive-text, var(--fb-red));
  --green: var(--success, var(--fb-success));
  --amber: var(--attention, var(--fb-attention));
  --warn: var(--warning-text, var(--fb-warning));
  --purple: var(--pr-merged, var(--fb-merged));
  --add: var(--diff-added, var(--fb-add)); --rem: var(--diff-removed, var(--fb-rem));
  --spin: color-mix(in oklab, var(--mfg) 50%, transparent);
  --skc: var(--surface-selected, var(--fb-sel));
  --ringc: var(--ring, var(--t1));
  --sh-xs: var(--shadow-xs, var(--fb-sh-xs)); --sh-sm: var(--shadow-sm, var(--fb-sh-sm)); --sh-md: var(--shadow-md, var(--fb-sh-md)); --sh-lg: var(--shadow-lg, var(--fb-sh-lg)); --lift: var(--shadow-lift, var(--fb-lift));
  --sans: var(--font-sans, "Inter Variable", InterVariable, Inter, system-ui, sans-serif);
  --mono: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
  --text-2xs: 10px; --text-xs: 12px; --text-sm: 13px; --text-base: 15px; --text-lg: 18px;
  --lh-xs: 16px; --lh-sm: 18px; --lh-prose: 21px; --lh-base: 22px; --lh-lg: 26px;
  --ctl: 28px; --btn: 32px; --btn-sm: 24px; --glyph: 16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--t1);font-family:var(--sans);font-size:13px;line-height:20px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ringc);outline-offset:1px}
.i{width:16px;height:16px;flex:none;fill:none;display:block}
.i14{width:14px;height:14px}.i12{width:12px;height:12px}
.g-red{color:var(--red)}.g-green{color:var(--green)}.g-purple{color:var(--purple)}.g-t1{color:var(--t1)}.g-t2{color:var(--t2)}.g-t3{color:var(--t3)}.g-mfg{color:var(--mfg)}.g-spin{color:var(--spin)}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.mono{font-family:var(--mono);font-size:var(--text-xs)}.num{font-variant-numeric:tabular-nums}.sp{flex:1}
.spin{animation:spin 1s linear infinite;animation-delay:var(--spd,0s)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}*{animation-duration:0s !important}}
kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:4px;background:var(--hover);font:400 var(--text-xs)/1 var(--sans);color:var(--t2);font-variant-numeric:tabular-nums}

/* prototype deck: not product */
.deck{display:flex;flex-direction:column;gap:10px}
.deckbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;padding:2px;gap:2px;border-radius:8px;background:var(--hover);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{flex:none;height:24px;padding:0 10px;border-radius:6px;font-size:12px;color:var(--t2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--t1);box-shadow:var(--sh-xs)}
.screen{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;container:gh / inline-size}
.stage.phone{display:flex;justify-content:center}
.stage.phone .screen{width:390px;border-radius:24px}
.anno{display:none;margin:0;padding:6px 10px;border:1px dashed var(--line);border-radius:6px;font-size:12px;line-height:16px;color:var(--t2)}
body.notes .anno{display:block}
.anno code{font-family:var(--mono);font-size:11px}

/* panel */
.gh{position:relative;display:flex;flex-direction:column;font-size:var(--text-sm);line-height:var(--lh-sm)}
.gh.panel{height:720px}
.stage.phone .gh.panel{height:780px}
body.framed .stage.phone .gh.panel{height:100vh}
.mroot{display:contents;font-size:var(--text-sm);line-height:var(--lh-sm)}
.timer{font-variant-numeric:tabular-nums}
.hostbar{height:48px;flex:none;display:flex;align-items:center;gap:4px;padding:0 10px 0 16px;border-bottom:1px solid color-mix(in oklab,var(--seam) 60%,transparent)}
.hostbar .ttl{display:flex;align-items:center;gap:8px;font-weight:600}
.hostbar{position:relative}
.pbar{position:absolute;left:0;right:0;bottom:-1px;height:2px;overflow:hidden;pointer-events:none;animation:skin .15s ease-out .12s both}
.pbar i{display:block;width:33%;height:100%;border-radius:999px;background:var(--mfg);animation:ind 1.5s ease-in-out infinite;animation-delay:var(--ind,0s)}
@keyframes ind{from{margin-inline-start:-35%}to{margin-inline-start:100%}}
@media (prefers-reduced-motion: reduce){.pbar i{animation:none;width:50%}.shine{animation:none;-webkit-mask-image:none;mask-image:none}}
.ibtn{width:var(--ctl);height:var(--ctl);border-radius:6px;display:inline-grid;place-items:center;flex:none;color:var(--mfg);transition:background-color .15s,color .15s}
.ibtn:hover{background:var(--hover);color:var(--t1);transition-duration:0s}
.ibtn.on,.ibtn.open{background:var(--active);color:var(--t1)}
.ibtn[disabled]{opacity:.5;pointer-events:none}
.layout{flex:1;min-height:0;display:flex}
.lcol{flex:1;min-width:0;display:flex;flex-direction:column}
.detail{display:none;flex:1;min-width:0;flex-direction:column}
.layout.has-detail .lcol{display:none}
.layout.has-detail .detail{display:flex}
.detail.enter{animation:din .22s cubic-bezier(.2,.8,.2,1) both}
@keyframes din{from{opacity:0;transform:translateX(12px)}}
@container gh (min-width: 960px){
  .layout.has-detail .lcol{display:flex;flex:0 0 44%;max-width:540px;border-right:1px solid var(--seam)}
  .layout.has-detail .back{display:none}
}
.viewbar{height:40px;flex:none;display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--seam)}
.tabs{display:flex;align-items:center;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.tab{height:var(--ctl);padding:0 8px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-weight:500;color:var(--t2);transition:background-color .15s,color .15s}
.tab:hover{background:var(--hover);color:var(--t1);transition-duration:0s}
.tab[aria-selected=true]{background:var(--active);color:var(--t1)}
.tab .c{font-size:var(--text-xs);font-weight:400;color:var(--t2);font-variant-numeric:tabular-nums}
.tab[aria-selected=true] .c{color:var(--mfg)}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:var(--ctl);padding:0 4px 0 10px;color:var(--mfg)}
.search input{flex:1;min-width:0;padding:0;border:0;outline:0;background:transparent;color:var(--t1)}
.search input::placeholder{color:var(--t2)}
.chips{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 16px;border-bottom:1px solid var(--seam)}
.fchip{height:24px;display:inline-flex;align-items:center;gap:5px;padding:0 2px 0 8px;border-radius:6px;border:1px solid var(--line);font-size:var(--text-xs);color:var(--t1)}
.fchip .k{color:var(--t2)}
.fchip button{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;color:var(--mfg)}
.fchip button:hover{background:var(--hover);color:var(--t1)}
.chips .count{font-size:var(--text-xs);color:var(--t2);margin-left:4px}

/* list */
.list{position:relative;flex:1;min-height:0;overflow:auto;padding:6px 8px 40px;scrollbar-width:thin}
.grp{position:sticky;top:0;z-index:3;display:flex;align-items:center;height:32px;margin:12px 0 2px;padding:0 8px;border-radius:6px;background:var(--band);font-size:var(--text-xs);font-weight:500;color:var(--t2);cursor:pointer;user-select:none}
.grp:first-child{margin-top:0}
.grp .chev{width:16px;display:grid;place-items:center;margin-right:8px;color:var(--t2);transition:transform .15s}
.grp:hover .chev{color:var(--t1)}
.grp.closed .chev{transform:rotate(-90deg)}
.grp .gc{margin-left:6px;font-weight:400;color:var(--t2);font-variant-numeric:tabular-nums}
.grp .gact{visibility:hidden}
.grp:hover .gact{visibility:visible}
.row{position:relative;display:flex;align-items:flex-start;gap:8px;height:48px;margin-top:2px;padding:6px 8px;border-radius:6px;cursor:default}
.row:hover{background:var(--hover)}
.row.picked,.row.menuopen{background:var(--hover)}
.row.sel,.row.cur{background:var(--active)}
.row:focus-visible{outline-offset:-2px}
.lead{position:relative;width:var(--glyph);height:var(--lh-sm);flex:none;display:grid;place-items:center}
.lead .gl{display:grid}
.pick{position:absolute;inset:0;display:none;place-items:center;color:var(--mfg);cursor:pointer}
.lead:hover .pick,.row.picked .pick{display:grid}
.lead:hover .gl,.row.picked .gl{visibility:hidden}
.row.picked .pick{color:var(--t1)}
.rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.l1,.l2{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l1{font-size:var(--text-sm);line-height:var(--lh-sm);font-weight:500;color:var(--t1)}
.cc{font-weight:400;color:var(--t2)}
.l2{font-size:var(--text-xs);line-height:var(--lh-xs);color:var(--t2)}
.sep{color:var(--t3);margin:0 5px}
.rm{flex:none;display:flex;align-items:center;justify-content:flex-end;gap:8px;height:var(--lh-sm);min-width:60px;font-size:var(--text-xs);color:var(--t2)}
.rm .prop{white-space:nowrap;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
.av{width:16px;height:16px;border-radius:50%;flex:none;object-fit:cover;background:var(--hover)}
.age{min-width:22px;text-align:right;font-variant-numeric:tabular-nums}
.qa{position:absolute;right:2px;top:1px;display:none;align-items:center;gap:2px}
.row:hover .qa,.row.sel .qa{display:flex}
.row:hover .rm,.row.sel .rm,.row.menuopen .rm{visibility:hidden}
.row.menuopen .qa{display:flex}
.row.flash{animation:flash 1.8s cubic-bezier(.4,0,.2,1) both}
@keyframes flash{from{background:var(--active)}}
.shine{-webkit-mask-image:linear-gradient(90deg,rgb(0 0 0 / .62) 0 38%,#000 50%,rgb(0 0 0 / .62) 62% 100%);mask-image:linear-gradient(90deg,rgb(0 0 0 / .62) 0 38%,#000 50%,rgb(0 0 0 / .62) 62% 100%);-webkit-mask-size:280% 100%;mask-size:280% 100%;animation:shine 1.6s linear infinite;animation-delay:var(--shd,0s)}
@keyframes shine{from{-webkit-mask-position:100% 0;mask-position:100% 0}to{-webkit-mask-position:0 0;mask-position:0 0}}
.numc{width:44px;flex:none;font-size:var(--text-xs);color:var(--t2);font-variant-numeric:tabular-nums}
.stc{flex:none;max-width:42%;font-size:var(--text-xs);color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh[data-density=compact] .row{height:32px;padding:0 8px;align-items:center}
.gh[data-density=compact] .l1{flex:1}
.gh[data-density=compact] .rm{height:auto}
.gh[data-density=compact] .qa{top:2px}
@container gh (min-width: 960px){ .layout.has-detail .l1 .cc{display:none} }
.peek{margin:4px 8px 10px 32px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:var(--text-xs);line-height:var(--lh-xs);color:var(--t2)}
.peek .pl{display:flex;align-items:center;gap:8px;min-width:0}
.peek .pl .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.peek .pl b{font-weight:500;color:var(--t1)}
.peek .keys{display:flex;gap:12px;padding-top:4px}
.peek .keys span{display:inline-flex;align-items:center;gap:6px}
.empty{padding:88px 24px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.empty .et{font-weight:500;color:var(--t1);margin-top:8px}
.empty .ed{font-size:var(--text-xs);line-height:var(--lh-xs);color:var(--t2);max-width:280px}
/* loading: bb's Skeleton (animate-pulse rounded-md bg-surface-selected) behind DelayedLoading (200 ms) */
.skel{display:block;flex:none;max-width:100%;border-radius:6px;background:var(--skc);animation:skp 2s cubic-bezier(.4,0,.6,1) infinite;animation-delay:var(--skd,0s)}
@keyframes skp{50%{opacity:.5}}
.skin{animation:skin .15s ease-out both}
@keyframes skin{from{opacity:0}}
.rv{animation:rv .15s cubic-bezier(.4,0,.2,1) both}
@keyframes rv{from{opacity:0}}
.skov{position:absolute;top:6px;left:8px;right:8px;pointer-events:none;animation:rvout .15s cubic-bezier(.4,0,.2,1) both}
@keyframes rvout{to{opacity:0}}
.row.skr{pointer-events:none}
.row.skr .l1,.row.skr .l2{display:flex;align-items:center}
.row.skr .l1{height:var(--lh-sm)}
.row.skr .l2{height:var(--lh-xs)}
.grp.skg{cursor:default}
.skl{flex:1;display:flex;align-items:center;min-height:16px}
.vh{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.banner{flex:none;display:flex;align-items:center;gap:8px;min-height:36px;padding:4px 8px 4px 16px;border-bottom:1px solid var(--seam);font-size:var(--text-xs);line-height:var(--lh-xs);color:var(--t2);animation:rv .15s ease-out both}
.cmt.pend{opacity:.6}

/* buttons: bb's default / outline / ghost (button.tsx, measured 32px) */
.btn{height:var(--btn);padding:0 12px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;white-space:nowrap;font-size:var(--text-xs);font-weight:500;color:var(--t1);background:transparent;border:1px solid var(--inp);transition:background-color .15s,color .15s}
.btn:hover{background:var(--hover);transition-duration:0s}
.btn.pri{background:var(--t1);color:var(--bg);border-color:transparent}
.btn.pri:hover{background:color-mix(in oklab,var(--t1) 90%,transparent)}
.btn.ghost{border-color:transparent;color:var(--mfg)}
.btn.ghost:hover{color:var(--t1)}
.btn.sm{height:var(--btn-sm);padding:0 6px;font-weight:400;gap:4px}
.btn[disabled]{opacity:.5;pointer-events:none}

/* detail */
.dbar{height:40px;flex:none;display:flex;align-items:center;gap:2px;padding:0 8px 0 26px;border-bottom:1px solid var(--seam)}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;padding-left:6px;white-space:nowrap;font-size:var(--text-xs);color:var(--t2)}
.crumb b{font-weight:500;color:var(--t1)}
.dscroll{flex:1;min-height:0;overflow:auto;scrollbar-width:thin}
.dbar .back{margin-left:-18px}
.dwrap{padding:24px 32px 56px}
.dmain{display:flex;flex-direction:column;gap:24px;min-width:0;max-width:720px}
.dhead{display:flex;flex-direction:column;gap:10px}
.dtitle{margin:0;font-size:var(--text-lg);line-height:var(--lh-lg);font-weight:600;letter-spacing:-.014em;color:var(--t1);text-wrap:pretty}
.dtitle .cc{font-weight:400}
.dtitle .n{color:var(--t2);font-weight:400}
.dmeta{display:flex;align-items:center;min-width:0;font-size:var(--text-xs);line-height:var(--lh-xs);color:var(--t2)}
.dmeta > *{flex:none;display:inline-flex;align-items:center;gap:6px}
.dmeta .branch{flex:0 1 auto;min-width:0;display:flex;font-family:var(--mono)}
.dmeta .branch .hd{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmeta .branch .bs{flex:none;white-space:pre}
.pill{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px 0 5px;border:1px solid var(--line);border-radius:999px;font-size:var(--text-xs);color:var(--t1);white-space:nowrap}
.add{color:var(--add)}.rem{color:var(--rem)}
.next{margin:0 -17px;border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.next .follow{margin-top:-2px}
.nh{display:flex;align-items:flex-start;gap:8px}
.nh .lead{height:20px}
.nt{font-weight:500;color:var(--t1);line-height:20px}
.ns{font-size:var(--text-xs);line-height:var(--lh-xs);color:var(--t2)}
.ind{margin-left:24px}
.nlist{display:flex;flex-direction:column}

 and build commands, and a search-first control. Correct the fixtures that relied on promoting later searches, including the server shell-summaries test.\n- No expansion preference, public API, server/daemon wire, storage, dependency, packaging, or generated-file changes.\n\n## How you verified\n\n- Added the regression before changing production code: on main, the three setup-first cases and the `cd … && node … | grep` case fail, and the search-first and `cd … && grep` cases pass. Before `cd` passed through, the `cd … && grep` case failed against this branch's first commit.\n- `pnpm exec turbo run test typecheck --filter=@bb/thread-view`: 504 tests across 31 files pass; typecheck passes.\n- `pnpm exec turbo run test --filter=@bb/server -- test/public/public-thread-shell-command-summaries.test.ts`: 2/2 pass; `@bb/server` typecheck passes.\n- Replayed main's and this branch's parsers over 75,127 real recorded agent commands from the last 30 days, without executing them. No `cd dir && <search/read>` command changes classification. The 11,128 commands that change all start with a non-exploratory command (for example `git`, `gh`, or `cd … && cp …`), so they now show as \"Ran …\".\n- Search-first commands with a later destructive non-redirect step (`ls x && rm -rf x`, `grep -l … | xargs rm`) still show the explore summary, as on main; this PR does not change that.\n- macOS desktop/browser verification was not run.\n\nFixes #5847\n\n> AGENT GENERATED\n\n<!-- slopcop:rule=new-issue-autopilot run=run_euf588rdmvgs329q sha=issue-5847 kind=summary -->\n", "files": [{"p": "apps/server/test/public/public-thread-shell-command-summaries.test.ts", "add": 2, "del": 2}, {"p": "packages/thread-view/src/tool-call-parsing.ts", "add": 7, "del": 0}, {"p": "packages/thread-view/test/build-thread-timeline.test.ts", "add": 2, "del": 3}, {"p": "packages/thread-view/test/tool-call-parsing.test.ts", "add": 2, "del": 9}, {"p": "packages/thread-view/test/v3-item-projection.test.ts", "add": 61, "d function filterChips() {
  const toks = S.q.trim().split(/\s+/).filter(Boolean);
  if (!toks.length) return "";
  const label = (tok) => {
    const m = tok.toLowerCase().match(/^(\w+):(.+)$/);
    if (!m || !QKEYS.has(m[1])) return `<span class="k">Contains</span>${esc(tok)}`;
    const [, k, v] = m;
    if (k === "is") return `<span class="k">Is</span>${esc({ draft: "a draft", ready: "ready to merge", conflict: "in conflict", failing: "failing checks", stacked: "stacked", snoozed: "snoozed" }[v] ?? v)}`;
    if (k === "author") return `<span class="k">Author is</span>${esc(v === "me" ? DATA.viewer : v)}`;
    if (k === "ci") return `<span class="k">Checks are</span>${esc(v)}`;
    if (k === "agent") return `<span class="k">Agent is</span>${esc(v)}`;
    if (k === "base") return `<span class="k">Base is</span>${esc(v)}`;
    return `<span class="k">In a stack</span>${esc(v)}`;
  };
  return `<div class="chips">${toks.map((tok, j) => `<span class="fchip">${label(tok)}<button data-act="rmtok" data-j="${j}" title="Remove">${ic("close", "i12")}</button></span>`).join("")}<span class="count">${plural(visible().length, "pull request")}</span></div>`;
}

const LOAD_NOTE = `Loading uses bb's own pieces: <code>Skeleton</code> rows (<code>animate-pulse</code> on <code>surface-selected</code>) behind <code>DelayedLoading</code>'s 200 ms, so a fast load never flashes; the route bar and a spinning Refresh while a sync runs; busy buttons and a loading toast for actions. One <code>RepositoryLists</code> request per repository fills every tab, the home section and the thread chip, so later switches are instant. Proposal on top: a 150 ms crossfade instead of a hard swap, and changed rows slide to their new group.`;

}

/* ---------- shell for screenshots ---------- */
function frameHtml(inner, modals = "") {
  if (S.device === "phone") return inner + modals;
  const g = (n) => { const [gi, gc] = glyphOf(byN(n)); return ic(gi, gc); };
  const row = (t, gl, chev) => `<div class="srow"><span class="tt">${esc(t)}</span>${chev ? ic("chev", "i12 g-t3") : ""}<span class="g">${gl}</span></div>`;
  return `<div class="bbapp"><nav class="rail0"><button class="ibtn">${ic("sideleft")}</button><button class="ibtn">${ic("home")}</button><button class="ibtn">${ic("bot")}</button><button class="ibtn">${ic("zap")}</button><button class="ibtn">${ic("chat")}</button><button class="ibtn on">${ic("gh")}</button><button class="ibtn">${ic("more")}</button><span class="sp"></span><button class="ibtn">${ic("settings")}</button></nav>
    <aside class="side"><div class="nt">${ic("newthread")}<span>New thread</span><span class="sp"></span>${ic("chevl", "i14 g-t3")}<span style="width:12px"></span>${ic("chev", "i14 g-t3")}</div>
      <div class="sl">${esc(SC.otherProject)} ${ic("chev", "i12")}</div><div class="sl">${esc(SC.project)}</div>
      ${row(AGENTS[SC.run].title, g(SC.run))}${row(AGENTS[SC.wait].title, g(SC.wait))}${row(AGENTS[SC.done].title, g(SC.done))}${SC.sideExtras.map(([t, k, chev]) => row(t, k === "spin" ? ic("dash", "g-spin spin") : ic("dotc", "i12 g-t3"), chev)).join("")}
      <div class="sl">Threads</div>${SC.threads.map(([t, k, chev]) => row(t, k === "spin" ? ic("dash", "g-spin spin") : ic("dotc", "i12 g-t3"), chev)).join("")}</aside>
    <main class="bbmain">${inner}</main>${modals}</div>`;
}

const modalsHtml = () => (S.mergePop || S.sheet ? `<div class="mroot">${S.mergePop ? mergeHtml() : ""}${S.sheet ? sheetHtml() : ""}</div>` : "");
function render() {
  const surfaces = [["panel", "Panel", "gh"], ["home", "Home", "home"], ["thread", "Thread", "chat"], ["palette", "Palette", "cmd"]];
  const raw = S.surface === "home" ? homeHtml() : S.surface === "thread" ? threadHtml() : S.surface === "palette" ? paletteHtml() : panelHtml();
  const body = S.frame && S.surface === "panel" ? frameHtml(raw, modalsHtml()) : raw + modalsHtml();
  document.body.classList.toggle("framed", !!S.frame);
  document.body.classList.toggle("notes", S.notes);
  const root = document.getElementById("root");
  const keepList = document.querySelector(".lcol .list")?.scrollTop ?? 0, keepDetail = document.querySelector(".dscroll")?.scrollTop ?? 0;
  const fa = document.activeElement, fk = fa?.dataset?.keep, fsel = fk ? [fa.selectionStart, fa.selectionEnd] : null;
  const before = flipNext ? flipKeys() : null;
  flipNext = false;
  const t = now();
  for (const [v, ms] of [["--spd", 1000], ["--skd", 2000], ["--shd", 1600], ["--ind", 1500]]) root.style.setProperty(v, `${-Math.round(t % ms)}ms`);
  const nets = [["fast", "Fast"], ["slow", "Slow network"], ["offline", "Offline"]];
  root.innerHTML = `<div class="deck">
    <div class="deckbar"><span class="seg">${surfaces.map(([id, l, i]) => `<button data-act="surface" data-surface="${id}" aria-pressed="${S.surface === id}">${ic(i, "i12")}${l}</button>`).join("")}</span><span class="seg"><button data-act="device" data-device="desktop" aria-pressed="${S.device === "desktop"}">${ic("monitor", "i12")}Desktop</button><button data-act="device" data-device="phone" aria-pressed="${S.device === "phone"}">${ic("phone", "i12")}Mobile</button></span><span class="seg"><button data-act="notes" aria-pressed="${S.notes}">SDK notes</button></span><span class="seg"><button data-act="replay" title="Empty the cache and load everything again">${ic("refresh", "i12")}Replay loading</button></span><span class="seg" role="group" aria-label="Network">${nets.map(([id, l]) => `<button data-act="net" data-net="${id}" aria-pressed="${S.net === id}">${l}</button>`).join("")}</span></div>
    <div class="stage${S.device === "phone" ? " phone" : ""}"><div class="screen">${body}</div></div></div>`;
  const l = document.querySelector(".lcol .list"); if (l) l.scrollTop = keepList;
  const d = document.querySelector(".dscroll"); if (d && !S.resetDetail) d.scrollTop = keepDetail;
  S.resetDetail = false;
  if (fk) { const el = root.querySelector(`[data-keep="${fk}"]`); if (el && !el.disabled) { el.focus(); try { el.setSelectionRange(fsel[0], fsel[1]); } catch {} } }
  const q = document.getElementById("q");
  if (q) {
    q.addEventListener("input", (e) => { S.q = e.target.value; S.sel = 0; const pos = e.target.selectionStart; render(); const nq = document.getElementById("q"); if (nq) { nq.focus(); nq.setSelectionRange(pos, pos); } });
    if (S.focusSearch) { S.focusSearch = false; q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
  placePops();
  settleAnims();
  tween();
  root.querySelectorAll(".skov").forEach((el) => el.addEventListener("animationend", (e) => { if (e.target === el) el.remove(); }));
  if (before) playFlip(before);
}

let toastTimer, toastSeq = 0;
function toast(msg, kind = "ok", id) {
  S.toast = { msg, kind, id: id ?? ++toastSeq };
  closePops();
  render();
  clearTimeout(toastTimer);
  if (kind !== "loading") toastTimer = setTimeout(() => { S.toast = null; render(); }, kind === "err" ? 4000 : 2400);
  return S.toast.id;
}
const closePops = () => { S.menu = null; S.snoozeMenu = null; S.disp = false; S.help = false; S.pop = false; S.toMenu = false; };
const openPr = (n) => { if (S.open == null) S.openedAt = now(); S.open = n; S.dtab = "activity"; S.descOpen = false; S.peek = null; S.toMenu = false; S.resetDetail = true; };

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) { if (S.menu || S.snoozeMenu || S.disp || S.help || S.pop || S.toMenu) { closePops(); render(); } return; }
  const a = t.dataset.act, n = Number(t.dataset.n);
  if ((a === "closesheet" || a === "closemerge") && e.target.closest("[data-stop]") && !e.target.closest(".ibtn,.btn")) return;
  if (a === "pick") { e.stopPropagation(); S.picked.has(n) ? S.picked.delete(n) : S.picked.add(n); render(); return; }
  if (a === "open") { closePops(); if (S.surface !== "panel") S.surface = "panel"; openPr(n); const i = flat().findIndex((p) => p.n === n); if (i >= 0) S.sel = i; render(); return; }
  e.stopPropagation();
  const keep = ["snooze", "unsnooze", "groupby", "density", "prop", "snoozemenu", "menu", "help", "disp", "to", "tomenu", "pop"].includes(a);
  if (!keep) closePops();
  switch (a) {
    case "close": S.open = null; break;
    case "toggle": if (e.target.closest(".gact")) return; S.collapsed[`${S.view}:${t.dataset.g}`] = !isClosed(t.dataset.g); break;
    case "view": S.view = t.dataset.view; S.surface = "panel"; S.sel = -1; S.open = null; S.peek = null; break;
    case "dtab": S.dtab = t.dataset.tab; break;
    case "desc": S.descOpen = !S.descOpen; break;
    case "sheet": closePops(); S.sheet = { n, preset: t.dataset.preset || "fix" }; break;
    case "preset": if (S.busy.launch) return; S.sheet.preset = t.dataset.preset; break;
    case "closesheet": if (S.busy.launch) return; S.sheet = null; break;
    case "launch": {
      if (S.busy.launch) return;
      const n0 = S.sheet.n, preset = S.sheet.preset;
      S.busy.launch = now(); render();
      setTimeout(() => { delete S.busy.launch; S.sheet = null; mutate(() => startAgent(n0, preset), n0); toast(`Agent started on #${n0}, thread linked`); }, lat("launch"));
      return;
    }
    case "mergepop": S.mergePop = n; break;
    case "closemerge": S.mergePop = null; break;
    case "method": S.mergeMethod = t.dataset.m; break;
    case "delbranch": S.delBranch = !S.delBranch; break;
    case "merge": {
      const p = byN(n), how = { squash: "Squash-merged", merge: "Merged", rebase: "Rebased and merged" }[S.mergeMethod], del = S.delBranch;
      S.mergePop = null; S.merging.add(n);
      const id = toast(`Merging #${n} into ${p.b}…`, "loading");
      setTimeout(() => {
        S.merging.delete(n);
        if (S.net === "offline") return toast(`Couldn't merge #${n}: GitHub is unreachable`, "err", id);
        mutate(() => mergePr(n));
        toast(`${how} #${n} into ${p.b}${del ? ", branch deleted" : ""}`, "ok", id);
      }, lat("merge"));
      return;
    }
    case "bulk": {
      const g = t.dataset.g, rows = grouped().find((x) => x.g.id === g)?.rows ?? [], k = `bulk:${g}`;
      if (S.busy[k] || !rows.length) return;
      S.busy[k] = now(); render();
      setTimeout(() => {
        delete S.busy[k];
        if (g === "ready") {
          if (S.net === "offline") return toast("Couldn't reach GitHub. Nothing was merged.", "err");
          mutate(() => rows.forEach((p) => mergePr(p.n)));
          return toast(`${plural(rows.length, "pull request")} merged`);
        }
        mutate(() => rows.forEach((p) => startAgent(p.n, presetFor(p))));
        toast(`${plural(rows.length, "agent")} started, one per pull request`);
      }, lat(g === "ready" ? "merge" : "launch"));
      return;
    }
    case "bulkagents": {
      const ns = [...S.picked];
      S.busy.bulkSel = now(); render();
      setTimeout(() => { delete S.busy.bulkSel; S.picked.clear(); mutate(() => ns.forEach((m) => { const p = byN(m); if (p) startAgent(m, presetFor(p)); })); toast(`${plural(ns.length, "agent")} started, one worktree each`); }, lat("launch"));
      return;
    }
    case "bulkready": { const ds = [...S.picked].map(byN).filter((p) => p?.d); S.picked.clear(); mutate(() => ds.forEach((p) => { p.d = false; })); return toast(ds.length ? `${plural(ds.length, "draft")} marked ready for review` : "None of them is a draft"); }
    case "bulksnooze": { const ns = [...S.picked]; S.picked.clear(); mutate(() => ns.forEach((m) => { S.snoozed[m] = "ci"; })); return toast(`${plural(ns.length, "pull request")} snoozed until checks change`); }
    case "snoozemenu": S.menu = null; S.snoozeMenu = S.snoozeMenu === n ? null : n; break;
    case "snooze": { const u = t.dataset.until; S.snoozeMenu = null; mutate(() => { S.snoozed[n] = u; }); return toast(`#${n} snoozed ${SNOOZE[u]}`); }
    case "unsnooze": S.snoozeMenu = null; mutate(() => { delete S.snoozed[n]; }, n); break;
    case "menu": S.snoozeMenu = null; S.menu = S.menu === n ? null : n; break;
    case "unpick": S.picked.clear(); break;
    case "disp": { const was = S.disp || S.help; closePops(); S.disp = !was; break; }
    case "help": { const was = S.help; closePops(); S.help = !was; break; }
    case "groupby": S.groupBy = t.dataset.group; S.sel = -1; break;
    case "density": S.density = t.dataset.d; break;
    case "prop": S.props[t.dataset.p] = !S.props[t.dataset.p]; break;
    case "opensearch": S.search = true; S.focusSearch = true; break;
    case "closesearch": S.search = false; S.q = ""; break;
    case "addtok": S.q = (S.q.trim() + " " + t.dataset.tok).trim() + " "; S.focusSearch = true; break;
    case "rmtok": S.q = S.q.trim().split(/\s+/).filter((_, j) => j !== Number(t.dataset.j)).join(" "); if (!S.q) S.search = false; break;
    case "follow": S.follow[n] = !S.follow[n]; return toast(S.follow[n] ? `#${n}: CI, reviews and comments go to the agent's thread` : `#${n}: events no longer go to the thread`);
    case "fpick": { const k = Number(t.dataset.i); S.fpick.has(k) ? S.fpick.delete(k) : S.fpick.add(k); break; }
    case "tomenu": { const was = S.toMenu; closePops(); S.toMenu = !was; break; }
    case "to": S.to = t.dataset.to; S.toMenu = false; break;
    case "thread": return toast(`Opening “${AGENTS[n]?.title ?? "the thread"}”`);
    case "refresh": sync(); return;
    case "clearq": S.q = ""; S.search = false; break;
    case "surface": S.surface = t.dataset.surface; break;
    case "device": S.device = t.dataset.device; break;
    case "notes": S.notes = !S.notes; break;
    case "pop": { const was = S.pop; closePops(); S.pop = !was; break; }
    case "ready": { const p = byN(n); if (!p?.d) return; mutate(() => { p.d = false; }, n); return toast(`#${n} marked ready for review`); }
    case "rerun": {
      const k = `rerun:${n}`;
      if (S.busy[k]) return;
      S.busy[k] = now(); render();
      setTimeout(() => {
        delete S.busy[k];
        if (S.net === "offline") return toast("Couldn't reach GitHub. Try again.", "err");
        const p = byN(n), c = p.fail || nFail(p);
        mutate(() => { p.pend = c; p.fail = 0; p.failing = []; }, n);
        toast(`Re-running ${plural(c, "failed check")} on #${n}`);
        tick(n);
      }, lat("rerun"));
      return;
    }
    case "send": case "resend": {
      const list = (S.sent[n] ??= []);
      let m;
      if (a === "resend") { m = list[Number(t.dataset.i)]; if (!m) return; m.failed = false; m.pending = true; }
      else {
        const text = (S.drafts[`reply:${n}`] ?? "").trim();
        if (!text) return;
        m = { to: S.to, text, at: now(), pending: true };
        list.push(m);
        S.drafts[`reply:${n}`] = "";
      }
      render();
      setTimeout(() => { m.pending = false; if (m.to === "gh" && S.net === "offline") m.failed = true; render(); }, lat("send"));
      return;
    }
    case "answer": {
      const k = `ask:${n}`, text = (S.drafts[k] ?? AGENTS[n]?.answer ?? "").trim();
      if (!text || S.busy[k]) return;
      S.busy[k] = now(); render();
      setTimeout(() => { delete S.busy[k]; delete S.drafts[k]; mutate(() => { AGENTS[n] = { ...AGENTS[n], status: "running", doing: "is resolving the conflicts", since: "now", t0: Date.now() }; }, n); toast("Reply sent · the agent is back at work"); }, lat("send"));
      return;
    }
    case "retry": L.err.delete(t.dataset.key || "list"); break;
    case "replay": replay(); break;
    case "net": S.net = t.dataset.net; if (S.net !== "offline") { L.err.clear(); S.syncErr = false; } break;
    case "toast": return toast(t.dataset.msg);
  }
  render();
});

document.addEventListener("keydown", (e) => {
  if (S.surface !== "panel") return;
  const tag = (e.target.tagName || "").toLowerCase();
  if ((tag === "input" || tag === "textarea") && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { const b = e.target.closest(".reply, .ask, .composer")?.querySelector(".send[data-act]"); if (b) { b.click(); e.preventDefault(); } return; }
  if (tag === "input" || tag === "textarea") { if (e.key === "Escape") { if (e.target.id === "q") { S.search = !!S.q.trim(); render(); } else e.target.blur(); } return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!listReady() && !["/", "?", "Escape", "Tab"].includes(e.key)) return;
  const f = flat(), k = e.key.toLowerCase(), cur = () => (S.open ? byN(S.open) : f[S.sel]);
  const rowEl = () => document.querySelector(".row.sel, .row.cur");
  const go = (d) => { S.sel = Math.max(0, Math.min(f.length - 1, S.sel + d)); if (S.open && f[S.sel]) openPr(f[S.sel].n); if (S.peek && f[S.sel]) S.peek = f[S.sel].n; render(); rowEl()?.scrollIntoView({ block: "nearest" }); };
  if (k === "j" || e.key === "ArrowDown") { go(1); e.preventDefault(); }
  else if (k === "k" || e.key === "ArrowUp") { go(-1); e.preventDefault(); }
  else if (e.key === "Enter") { if (f[S.sel]) { openPr(f[S.sel].n); render(); } }
  else if (e.key === "Escape") { if (S.sheet) { if (!S.busy.launch) S.sheet = null; } else if (S.mergePop) S.mergePop = null; else if (S.menu || S.snoozeMenu || S.disp || S.help || S.toMenu) closePops(); else if (S.peek) S.peek = null; else if (S.picked.size) S.picked.clear(); else if (S.open) S.open = null; else if (S.search) { S.search = false; S.q = ""; } render(); }
  else if (e.key === " ") { const p = f[S.sel]; if (p && !S.open) { S.peek = S.peek === p.n ? null : p.n; render(); } e.preventDefault(); }
  else if (k === "x") { const p = f[S.sel]; if (p) { S.picked.has(p.n) ? S.picked.delete(p.n) : S.picked.add(p.n); render(); } }
  else if (k === "a") { const p = cur(); if (p && !p.merged) { S.sheet = { n: p.n, preset: presetFor(p) }; render(); } }
  else if (k === "m") { const p = cur(); if (p) { if (attention(p) === "ready" && !p.merged && !S.merging.has(p.n)) { S.mergePop = p.n; render(); } else toast(`#${p.n} isn't ready to merge yet`); } }
  else if (k === "r") { const p = cur(); if (p?.d && !p.merged) { mutate(() => { p.d = false; }, p.n); toast(`#${p.n} marked ready for review`); } }
  else if (k === "z") { const p = cur(); if (p && !p.merged) { closePops(); S.snoozeMenu = p.n; render(); } }
  else if (k === "t") { const p = cur(); if (p && AGENTS[p.n]) toast(`Opening “${AGENTS[p.n].title}”`); }
  else if (k === "c") { const p = cur(); if (p) toast(`Copied ${p.h}`); }
  else if (k === "o") { const p = cur(); if (p) toast(`Opening #${p.n} on GitHub`); }
  else if (k === "/") { S.search = true; S.focusSearch = true; render(); e.preventDefault(); }
  else if (e.key === "?") { const was = S.help; closePops(); S.help = !was; render(); }
  else if (e.key === "V" && e.shiftKey) { const was = S.disp; closePops(); S.disp = !was; render(); }
  else if (e.key === "Tab") { const i = VIEWS.findIndex((v) => v.id === S.view); S.view = VIEWS[(i + (e.shiftKey ? VIEWS.length - 1 : 1)) % VIEWS.length].id; S.sel = -1; S.open = null; S.peek = null; render(); e.preventDefault(); }
});

document.addEventListener("input", (e) => {
  const k = e.target.dataset?.keep;
  if (!k) return;
  S.drafts[k] = e.target.value;
  e.target.closest(".reply")?.querySelector(".send")?.classList.toggle("idle", !e.target.value.trim());
});
addEventListener("resize", placePops);
document.fonts?.addEventListener?.("loadingdone", placePops);
document.addEventListener("scroll", () => { if (document.querySelector(".pop[data-for]")) placePops(); }, true);

render();
})();
</script>
