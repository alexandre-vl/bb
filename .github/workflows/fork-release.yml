name: Fork Release

on:
  workflow_run:
    workflows: ["Fork CI"]
    types: [completed]
    branches: [alex]

permissions:
  actions: read
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish the tested bb-app tarball
    if: github.repository == 'alexandre-vl/bb' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Download the tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bb-app-release
          path: ${{ runner.temp }}/out
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN: ${{ github.event.workflow_run.id }}
          OUT: ${{ runner.temp }}/out
        run: |
          set -euo pipefail
          (cd "$OUT" && sha256sum -c SHA256SUMS)
          version=$(cat "$OUT/version.txt")
          tag="fork-v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag already exists."
            exit 0
          fi
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "bb $version built from alex@${SHA:0:9}, tested by Fork CI run $RUN."
            echo
            echo "Upstream main: \`$(git merge-base origin/main "$SHA" | cut -c1-9)\`"
            echo
            echo "Layers, in merge order:"
            git log --first-parent --merges --format='%s' "origin/main..$SHA" | tac | sed -E 's/^Merge (.*) into alex$/- \1/'
          } > "$notes"
          gh release create "$tag" "$OUT/bb-app.tgz" "$OUT/version.txt" "$OUT/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --latest \
            --title "bb $version (alex)" --notes-file "$notes"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' |
            grep '^fork-v' | tail -n +11 |
            while read -r old; do gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes; done
